name: Build & Release Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile ESP32-C3 firmware
        run: pio run

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} - ESP32-C3 SuperMini RC Car
          files: |
            .pio/build/esp32-c3-supermini/firmware-full.bin
            .pio/build/esp32-c3-supermini/firmware.bin
            .pio/build/esp32-c3-supermini/bootloader.bin
            .pio/build/esp32-c3-supermini/partitions.bin
